<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevConnect</title>
    <script>
      // GitHub Pages SPA fix
      // When GitHub Pages hits a 404 for a deep route (e.g. /DevConnect/orders),
      // this page encodes the path into the query string and redirects to the
      // root index.html, which then restores the original path via the script in index.html.
      var segmentCount = 1; // number of path segments in the repo name e.g. /DevConnect = 1
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
